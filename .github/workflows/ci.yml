name: CI — Mobile

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Không sinh config/env/*.dart nữa: không dòng code nào đọc chúng.
      # Cấu hình môi trường đi qua --dart-define, xem lib/app/env_config.dart.

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Coverage report (PR comment)
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          lcov-file: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: "Coverage Report — Mobile"

  build-web:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Enable web platform
        run: flutter create . --platforms web

      # Tên biến phải khớp ĐÚNG String.fromEnvironment trong
      # lib/app/env_config.dart (APP_ENV / API_BASE_URL / AI_BASE_URL). Sai tên
      # thì build im lặng rơi về default dev → bật LoggingInterceptor và trỏ
      # API vào localhost. Ops set repo variables API_BASE_URL / AI_BASE_URL.
      - name: Build Web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$AI_BASE_URL" ]; then
            echo "::error::Thiếu repo variable API_BASE_URL hoặc AI_BASE_URL."
            exit 1
          fi
          flutter build web --release \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=AI_BASE_URL="$AI_BASE_URL"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smart-kitchen-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
