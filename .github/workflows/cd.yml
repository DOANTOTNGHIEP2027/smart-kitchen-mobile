name: Mobile CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobile-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  release-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web release
        run: |
          set -euxo pipefail
          test -f pubspec.yaml
          flutter pub get
          flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-release
          path: build/web/**

      - name: Set image tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/mobile-web" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (optional)
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -euxo pipefail
          docker build -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" .

      - name: Push image
        if: steps.login.outcome == 'success'
        run: |
          set -euxo pipefail
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: CD summary
        if: always()
        run: |
          echo "Image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.login.outcome }}" != "success" ]; then
            echo "Skipped push: GHCR login failed." >> "$GITHUB_STEP_SUMMARY"
          fi
