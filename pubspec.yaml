name: smart_kitchen_mobile
description: Smart Kitchen mobile and web client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Routing + dependency injection (KHÔNG dùng Rx/Obx cho feature state — xem
  # fe-app-shell.md §4 quyết định D1).
  get: ^4.7.2

  # Reactive state — cơ chế state duy nhất của project.
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0

  # HTTP client + pipeline interceptor (fe-app-shell.md §7).
  dio: ^5.9.0

  # Refresh token nằm trong secure storage; access token chỉ in-memory (D6).
  flutter_secure_storage: ^9.2.4

  # Issue #16 — Firebase Auth + Google Sign-In (chỉ ở mức gateway).
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  mobx_codegen: ^2.7.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
