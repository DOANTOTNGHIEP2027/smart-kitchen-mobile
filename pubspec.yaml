name: smart_kitchen_mobile
description: Smart Kitchen mobile and web client
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Routing + dependency injection (KHÔNG dùng Rx/Obx cho feature state — xem
  # fe-app-shell.md §4 quyết định D1).
  get: ^4.7.2

  # Reactive state — cơ chế state duy nhất của project.
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0

  # HTTP client + pipeline interceptor (fe-app-shell.md §7).
  dio: ^5.9.0

  # Refresh token nằm trong secure storage; access token chỉ in-memory (D6).
  flutter_secure_storage: ^9.2.4

  # Issue #16 — Firebase Auth + Google Sign-In (chỉ ở mức gateway).
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  google_sign_in: ^6.3.0
  mobile_scanner: ^7.4.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0

  # Offline read-cache (FE-3 §5) + nền tảng cho FE-4 (AppDatabase dùng chung).
  # Đã duyệt sẵn theo §6.1 D-05.
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0

  # FE-3 — Realtime WebSocket (STOMP over raw WS — BE không dùng SockJS).
  # web_socket_channel là package chính thức của Dart, không có dependency nặng.
  web_socket_channel: ^3.0.3

  # FE-3 — Push notification (FCM + local notification for foreground).
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^20.1.0

  # FE-3 — Connectivity để detect online/offline và kích hoạt sync.
  connectivity_plus: ^7.1.1

  # Epic 9 (#94) — AppCachedImage: disk-cache ảnh mạng (≈100MB/7 ngày/LRU),
  # lazy-load + memCacheWidth/Height chống decode full-res. Kết hợp flutter_cache_manager.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # FE-6 — WakeLock giữ màn hình sáng suốt buổi nấu (yêu cầu #81).
  # Ngoài §6.1 D-05 — được duyệt qua §0.2 (ifetime duy nhất thêm dependency).
  wakelock_plus: ^1.2.0

  # Insight #87 — biểu đồ calo/macro/adherence (nutrition-trend-history.md Q3 —
  # fl_chart không có version chốt trước đây trong repo, thêm theo §6.1 D-05).
  fl_chart: ^0.70.2

  # Insight #86 — Weekly Recap: chia sẻ ảnh PNG đã capture (weekly-recap-screen.md
  # §9.5, D7). path_provider (temp dir) đã duyệt ở D-05.
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  mobx_codegen: ^2.7.0
  drift_dev: ^2.21.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
